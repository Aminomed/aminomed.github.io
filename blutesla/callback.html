<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BluTesla – Anmeldung</title>
  <style>
    body { background:#0b0d10; color:#e6e8eb; font-family:system-ui,sans-serif;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    main { text-align:center; padding:24px; }
    a { display:inline-block; margin-top:16px; padding:12px 24px; border-radius:10px;
        background:#3e6ae1; color:#fff; text-decoration:none; font-weight:600; }
    p { color:#9aa1a9; }
  </style>
</head>
<body>
<main>
  <h1>BluTesla</h1>
  <p id="msg">Weiterleitung zur App …</p>
  <a id="open" href="#">App öffnen</a>
</main>
<script>
  // Leitet den OAuth-Code (code, state) unverändert an die App weiter.
  // Diese Seite speichert oder versendet nichts.
  (function () {
    var target = 'blutesla://auth/callback' + window.location.search;
    document.getElementById('open').href = target;
    if (!window.location.search) {
      document.getElementById('msg').textContent = 'Kein Anmeldecode vorhanden.';
      return;
    }
    window.location.replace(target);
  })();
</script>
</body>
</html>
